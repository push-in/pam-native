name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  PAM_RUNTIME_RELEASE_TAG: v0.1.32

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  ios:
    name: Package iOS renderer
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Build Swift package for iOS
        working-directory: ios
        run: >-
          xcodebuild
          -scheme PamNative
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Create versioned archive
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent ios \
            "dist/pam-native-ios-${version}.zip"
          (
            cd dist
            shasum -a 256 "pam-native-ios-${version}.zip" \
              > "pam-native-ios-${version}.zip.sha256"
          )
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.zip
      - uses: actions/upload-artifact@v7
        with:
          name: pam-native-ios
          path: dist/pam-native-ios-*
          if-no-files-found: error

  android:
    name: Package Android renderer and plugin API
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-release
      - name: Build renderer, engines, and plugin API
        run: |
          sdkmanager "platforms;android-36"
          cargo clean --package pam-native-engine --package pam-native-protocol
          scripts/prepare-android-runtime.sh
          ./android/gradlew -p android \
            -PpamNativeRoot="$GITHUB_WORKSPACE" \
            :app:assembleRelease \
            :plugin-api:assembleRelease
      - name: Create versioned artifacts
        run: |
          version=${GITHUB_REF_NAME#v}
          mkdir -p dist
          cp android/plugin-api/build/outputs/aar/plugin-api-release.aar \
            "dist/pam-native-android-plugin-api-${version}.aar"
          tar -czf "dist/pam-native-android-renderer-${version}.tar.gz" \
            android/app/src/main \
            android/app/build.gradle.kts \
            native/pam_native_engine.h \
            target/aarch64-linux-android/release/libpam_native_engine.a \
            target/x86_64-linux-android/release/libpam_native_engine.a
          (
            cd dist
            sha256sum "pam-native-android-plugin-api-${version}.aar" \
              > "pam-native-android-plugin-api-${version}.aar.sha256"
            sha256sum "pam-native-android-renderer-${version}.tar.gz" \
              > "pam-native-android-renderer-${version}.tar.gz.sha256"
          )
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.aar
            dist/*.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: pam-native-android
          path: dist/pam-native-android-*
          if-no-files-found: error

  php-sdk:
    name: Package PHP SDK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Create reproducible SDK archive
        run: |
          version=${GITHUB_REF_NAME#v}
          source_date_epoch=$(git log -1 --format=%ct)
          mkdir -p dist
          tar \
            --sort=name \
            --mtime="@${source_date_epoch}" \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            --transform="s,^,pam-native-php-${version}/," \
            -cf "dist/pam-native-php-${version}.tar" \
            -C packages/native .
          gzip -n "dist/pam-native-php-${version}.tar"
          (
            cd dist
            sha256sum "pam-native-php-${version}.tar.gz" \
              > "pam-native-php-${version}.tar.gz.sha256"
          )
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: pam-native-php
          path: dist/pam-native-php-*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs:
      - ios
      - android
      - php-sdk
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: pam-native-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true

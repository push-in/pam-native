name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  PAM_RUNTIME_RELEASE_TAG: v2.0.7

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  source-contracts:
    name: Certify source contracts and device hosts
    uses: ./.github/workflows/ci.yml

  ecosystem-compatibility:
    name: Certify the complete PAM Native ecosystem
    uses: push-in/pam/.github/workflows/ecosystem-compatibility.yml@main

  ecosystem-android:
    name: Certify official Android plugins
    uses: ./.github/workflows/ecosystem-android.yml

  ecosystem-ios:
    name: Certify official iOS plugins
    uses: ./.github/workflows/ecosystem-ios.yml

  ios:
    name: Package iOS renderer
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Build Swift package for iOS
        working-directory: ios
        run: >-
          xcodebuild
          -scheme PamNative
          -configuration Release
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          BUILD_LIBRARY_FOR_DISTRIBUTION=YES
          SWIFT_COMPILATION_MODE=wholemodule
          DEAD_CODE_STRIPPING=YES
          build
      - name: Create versioned archive
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          mkdir -p dist
          artifact="pam-native-ios-${version}.zip"
          git archive \
            --format=zip \
            --prefix="pam-native-ios-${version}/" \
            --output="dist/${artifact}" \
            HEAD:ios
          git archive \
            --format=zip \
            --prefix="pam-native-ios-${version}/" \
            --output="${RUNNER_TEMP}/${artifact}" \
            HEAD:ios
          cmp "dist/${artifact}" "${RUNNER_TEMP}/${artifact}"
          python3 benchmarks/package/reproducibility.py \
            --pair "1=dist/${artifact}=${RUNNER_TEMP}/${artifact}" \
            --output "dist/pam-native-ios-${version}.reproducibility.json"
          rm "${RUNNER_TEMP}/${artifact}"
          (
            cd dist
            shasum -a 256 "${artifact}" > "${artifact}.sha256"
          )
      - name: Enforce the iOS package budget
        run: >-
          python3 benchmarks/package/gate.py
          --artifact "1=dist/pam-native-ios-${GITHUB_REF_NAME#v}.zip"
          --output "dist/pam-native-ios-${GITHUB_REF_NAME#v}.package-budget.json"
      - name: Verify the iOS package budget evidence
        run: >-
          python3 benchmarks/package/gate.py
          --artifact "1=dist/pam-native-ios-${GITHUB_REF_NAME#v}.zip"
          --verify-report "dist/pam-native-ios-${GITHUB_REF_NAME#v}.package-budget.json"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.zip
            dist/*.package-budget.json
            dist/*.reproducibility.json
      - uses: actions/upload-artifact@v7
        with:
          name: pam-native-ios
          path: dist/pam-native-ios-*
          if-no-files-found: error
          retention-days: 7

  android:
    name: Package Android renderer and plugin API
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-release
      - name: Build renderer, engines, and plugin API
        run: |
          sdkmanager "platforms;android-36"
          cargo clean --package pam-native-engine --package pam-native-protocol
          scripts/prepare-android-runtime.sh
          ./android/gradlew -p android \
            -PpamNativeRoot="$GITHUB_WORKSPACE" \
            :app:assembleRelease \
            :plugin-api:assembleRelease
      - name: Create versioned artifacts
        run: |
          version=${GITHUB_REF_NAME#v}
          source_date_epoch=$(git log -1 --format=%ct)
          mkdir -p dist
          cp android/plugin-api/build/outputs/aar/plugin-api-release.aar \
            "dist/pam-native-android-plugin-api-${version}.aar"
          create_renderer_archive() {
            output=$1
            tar \
              --sort=name \
              --mtime="@${source_date_epoch}" \
              --owner=0 \
              --group=0 \
              --numeric-owner \
              --transform="s,^,pam-native-android-renderer-${version}/," \
              -cf "${output%.gz}" \
              Cargo.toml \
              Cargo.lock \
              crates/pam-native-engine \
              crates/pam-native-protocol \
              android/build.gradle.kts \
              android/app/proguard-rules.pro \
              android/app/src/firebase \
              android/app/src/main \
              android/app/build.gradle.kts \
              native/pam_native_engine.h \
              target/aarch64-linux-android/release/libpam_native_engine.a \
              target/x86_64-linux-android/release/libpam_native_engine.a
            gzip -n "${output%.gz}"
          }
          artifact="pam-native-android-renderer-${version}.tar.gz"
          create_renderer_archive "dist/${artifact}"
          create_renderer_archive "${RUNNER_TEMP}/${artifact}"
          cmp "dist/${artifact}" "${RUNNER_TEMP}/${artifact}"
      - name: Rebuild and verify the Android plugin API reproducibly
        run: |
          version=${GITHUB_REF_NAME#v}
          artifact="dist/pam-native-android-plugin-api-${version}.aar"
          ./android/gradlew -p android \
            -PpamNativeRoot="$GITHUB_WORKSPACE" \
            :plugin-api:clean \
            :plugin-api:assembleRelease
          cmp "${artifact}" android/plugin-api/build/outputs/aar/plugin-api-release.aar
          renderer="pam-native-android-renderer-${version}.tar.gz"
          python3 benchmarks/package/reproducibility.py \
            --pair "2=dist/${renderer}=${RUNNER_TEMP}/${renderer}" \
            --pair "3=${artifact}=android/plugin-api/build/outputs/aar/plugin-api-release.aar" \
            --output "dist/pam-native-android-${version}.reproducibility.json"
          rm "${RUNNER_TEMP}/${renderer}"
      - name: Write Android checksums
        run: |
          version=${GITHUB_REF_NAME#v}
          (
            cd dist
            sha256sum "pam-native-android-plugin-api-${version}.aar" \
              > "pam-native-android-plugin-api-${version}.aar.sha256"
            sha256sum "pam-native-android-renderer-${version}.tar.gz" \
              > "pam-native-android-renderer-${version}.tar.gz.sha256"
          )
      - name: Enforce Android package budgets
        run: >-
          python3 benchmarks/package/gate.py
          --artifact "2=dist/pam-native-android-renderer-${GITHUB_REF_NAME#v}.tar.gz"
          --artifact "3=dist/pam-native-android-plugin-api-${GITHUB_REF_NAME#v}.aar"
          --output "dist/pam-native-android-${GITHUB_REF_NAME#v}.package-budget.json"
      - name: Verify Android package budget evidence
        run: >-
          python3 benchmarks/package/gate.py
          --artifact "2=dist/pam-native-android-renderer-${GITHUB_REF_NAME#v}.tar.gz"
          --artifact "3=dist/pam-native-android-plugin-api-${GITHUB_REF_NAME#v}.aar"
          --verify-report "dist/pam-native-android-${GITHUB_REF_NAME#v}.package-budget.json"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.aar
            dist/*.tar.gz
            dist/*.package-budget.json
            dist/*.reproducibility.json
      - uses: actions/upload-artifact@v7
        with:
          name: pam-native-android
          path: dist/pam-native-android-*
          if-no-files-found: error
          retention-days: 7

  php-sdk:
    name: Package PHP SDK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Create reproducible SDK archive
        run: |
          version=${GITHUB_REF_NAME#v}
          source_date_epoch=$(git log -1 --format=%ct)
          mkdir -p dist
          create_php_archive() {
            output=$1
            tar \
              --sort=name \
              --mtime="@${source_date_epoch}" \
              --owner=0 \
              --group=0 \
              --numeric-owner \
              --transform="s,^,pam-native-php-${version}/," \
              -cf "${output%.gz}" \
              -C packages/native .
            gzip -n "${output%.gz}"
          }
          artifact="pam-native-php-${version}.tar.gz"
          create_php_archive "dist/${artifact}"
          create_php_archive "${RUNNER_TEMP}/${artifact}"
          cmp "dist/${artifact}" "${RUNNER_TEMP}/${artifact}"
          python3 benchmarks/package/reproducibility.py \
            --pair "4=dist/${artifact}=${RUNNER_TEMP}/${artifact}" \
            --output "dist/pam-native-php-${version}.reproducibility.json"
          rm "${RUNNER_TEMP}/${artifact}"
          (
            cd dist
            sha256sum "${artifact}" > "${artifact}.sha256"
          )
      - name: Enforce the PHP SDK package budget
        run: >-
          python3 benchmarks/package/gate.py
          --artifact "4=dist/pam-native-php-${GITHUB_REF_NAME#v}.tar.gz"
          --output "dist/pam-native-php-${GITHUB_REF_NAME#v}.package-budget.json"
      - name: Verify the PHP SDK package budget evidence
        run: >-
          python3 benchmarks/package/gate.py
          --artifact "4=dist/pam-native-php-${GITHUB_REF_NAME#v}.tar.gz"
          --verify-report "dist/pam-native-php-${GITHUB_REF_NAME#v}.package-budget.json"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.package-budget.json
            dist/*.reproducibility.json
      - uses: actions/upload-artifact@v7
        with:
          name: pam-native-php
          path: dist/pam-native-php-*
          if-no-files-found: error
          retention-days: 7

  native-cli:
    name: Package Native CLI (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            extension: ''
          - runner: macos-15
            target: aarch64-apple-darwin
            platform: macos-aarch64
            extension: ''
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            extension: '.exe'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: native-cli-${{ matrix.platform }}
      - name: Build versioned Native CLI
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          artifact="pam-native-cli-${version}-${{ matrix.platform }}${{ matrix.extension }}"
          cargo build --locked --release --package pam-native-cli --target '${{ matrix.target }}'
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/pam-native${{ matrix.extension }}" "dist/${artifact}"
          sha256sum "dist/${artifact}" > "dist/${artifact}.sha256"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/pam-native-cli-*
      - uses: actions/upload-artifact@v7
        with:
          name: pam-native-cli-${{ matrix.platform }}
          path: dist/pam-native-cli-*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs:
      - ios
      - android
      - php-sdk
      - native-cli
      - source-contracts
      - ecosystem-compatibility
      - ecosystem-android
      - ecosystem-ios
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: pam-native-*
          path: dist
          merge-multiple: true
      - name: Reverify downloaded package budget evidence
        run: |
          version=${GITHUB_REF_NAME#v}
          python3 benchmarks/package/gate.py \
            --artifact "1=dist/pam-native-ios-${version}.zip" \
            --verify-report "dist/pam-native-ios-${version}.package-budget.json"
          python3 benchmarks/package/gate.py \
            --artifact "2=dist/pam-native-android-renderer-${version}.tar.gz" \
            --artifact "3=dist/pam-native-android-plugin-api-${version}.aar" \
            --verify-report "dist/pam-native-android-${version}.package-budget.json"
          python3 benchmarks/package/gate.py \
            --artifact "4=dist/pam-native-php-${version}.tar.gz" \
            --verify-report "dist/pam-native-php-${version}.package-budget.json"
      - name: Reverify downloaded reproducibility evidence
        run: |
          version=${GITHUB_REF_NAME#v}
          python3 benchmarks/package/reproducibility.py \
            --artifact "1=dist/pam-native-ios-${version}.zip" \
            --verify-report "dist/pam-native-ios-${version}.reproducibility.json"
          python3 benchmarks/package/reproducibility.py \
            --artifact "2=dist/pam-native-android-renderer-${version}.tar.gz" \
            --artifact "3=dist/pam-native-android-plugin-api-${version}.aar" \
            --verify-report "dist/pam-native-android-${version}.reproducibility.json"
          python3 benchmarks/package/reproducibility.py \
            --artifact "4=dist/pam-native-php-${version}.tar.gz" \
            --verify-report "dist/pam-native-php-${version}.reproducibility.json"
      - name: Attest cross-platform accessibility evidence
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/pam-native-accessibility-evidence.json
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true

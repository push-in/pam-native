name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  PAM_RUNTIME_RELEASE_TAG: v0.1.32

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  contracts:
    name: Rust, PHP ${{ matrix.php }}, and protocol contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php:
          - "8.4"
          - "8.5"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy,rustfmt
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
      - uses: Swatinem/rust-cache@v2
      - name: Validate manifests
        run: |
          cargo metadata --locked --no-deps
          composer validate --strict --no-check-lock packages/native/composer.json
          composer validate --strict --no-check-lock examples/community-plugin/composer.json
          composer validate --strict --working-dir=examples/showcase
      - name: Rust contracts
        run: |
          cargo fmt --all -- --check
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
      - name: PHP and benchmark contracts
        run: |
          composer install --working-dir=examples/showcase --no-interaction
          cargo run --locked --release -p pam-native-engine --example benchmark -- --check
          php packages/native/tests/run.php
          php packages/native/tests/performance.php
          php packages/native/tests/navigation_performance.php
          php packages/native/tests/fuzz.php
          python3 -m unittest benchmarks/mobile/test_compare.py
          python3 -m json.tool benchmarks/mobile/budgets.json >/dev/null
          python3 -m json.tool benchmarks/ios/budgets.json >/dev/null
          node --check editors/vscode/extension.js
          node editors/vscode/test.js

  android:
    name: Android renderer build and unit contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Install Android build dependencies
        run: sdkmanager "platforms;android-36" "ndk;27.1.12297006" "cmake;3.22.1"
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - name: Prepare checksummed runtime and native engine
        run: scripts/prepare-android-runtime.sh
      - name: Test and build the Android renderer
        run: >-
          ./android/gradlew
          -p android
          -PpamNativeRoot="$GITHUB_WORKSPACE"
          :app:testDebugUnitTest
          :app:lintDebug
          :app:assembleDebug
          :macrobenchmark:assembleBenchmark
          :plugin-api:assembleRelease
      - name: Package instrumented-test prerequisites
        run: |
          mkdir -p dist
          tar -czf dist/pam-native-android-prerequisites.tar.gz \
            runtime/android \
            target/aarch64-linux-android/release/libpam_native_engine.a \
            target/x86_64-linux-android/release/libpam_native_engine.a
      - uses: actions/upload-artifact@v7
        with:
          name: pam-native-android-build
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/plugin-api/build/outputs/aar/plugin-api-release.aar
            android/app/build/reports/lint-results-debug.html
            android/app/build/test-results/testDebugUnitTest/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: pam-native-android-prerequisites
          path: dist/pam-native-android-prerequisites.tar.gz
          if-no-files-found: error

  android-instrumented:
    name: Android API ${{ matrix.api-level }} renderer contracts
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level:
          - 26
          - 36
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Install Android build dependencies
        run: sdkmanager "platforms;android-36" "ndk;27.1.12297006" "cmake;3.22.1"
      - uses: actions/download-artifact@v8
        with:
          name: pam-native-android-prerequisites
          path: dist
      - name: Restore native prerequisites
        run: tar -xzf dist/pam-native-android-prerequisites.tar.gz
      - name: Enable KVM
        run: |
          sudo usermod -aG kvm "$USER"
          sudo chmod 666 /dev/kvm
      - name: Run renderer and navigation contracts
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: ./android/gradlew -p android -PpamNativeRoot="$GITHUB_WORKSPACE" :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pam-native-android-api-${{ matrix.api-level }}-tests
          path: |
            android/app/build/reports/androidTests/connected/
            android/app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn

  ios:
    name: Swift and UIKit contracts
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Test PamNative on an iOS Simulator
        working-directory: ios
        run: |
          udid=$(
            xcrun simctl list devices available |
              awk -F '[()]' '/iPhone/ { print $2; exit }'
          )
          test -n "${udid}"
          xcodebuild \
            -scheme PamNative \
            -destination "platform=iOS Simulator,id=${udid}" \
            CODE_SIGNING_ALLOWED=NO \
            test
      - name: Build PamNative for the iOS Simulator
        working-directory: ios
        run: >-
          xcodebuild
          -scheme PamNative
          -configuration Release
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          SWIFT_COMPILATION_MODE=wholemodule
          DEAD_CODE_STRIPPING=YES
          build
